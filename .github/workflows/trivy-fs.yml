name: 'Trivy FS'

# Scans web/package-lock.json: the web UI's packages are bundled into the binary,
# where the image scan cannot see them. Cargo.lock is skipped (trivy.yaml): the
# image scan reads the crates the binary was built with (cargo auditable), and the
# lock file also lists crates no image ships, such as informdump's MongoDB driver.
on:
  schedule:
    - cron: '47 12 * * *'
  workflow_dispatch:

jobs:
  scan:
    uses: 'trexx/actions/.github/workflows/trivy-fs.yml@e55688a60847a9cf87d0ead14cf3885560ab9bac' # main
    secrets: 'inherit'
    permissions:
      contents: 'read'
      security-events: 'write'
      actions: 'read'
