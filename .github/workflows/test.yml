name: 'Test'

on:
  push:
    branches: [ 'master' ]
  pull_request:
  workflow_call:

jobs:
  rust:
    runs-on: 'ubuntu-26.04'
    timeout-minutes: 30
    permissions:
      contents: 'read'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      - uses: 'dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f' # master
        with:
          # The release of the Dockerfile's rust image: Renovate bumps both in one PR
          # (.github/renovate.json).
          toolchain: '1.98'
          components: 'clippy'
      - uses: 'Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6' # v2.9.2
      # The tests built on real captures need fixtures kept outside the repository
      # (APCTL_TESTDATA); without them they pass without checking anything.
      - name: 'Capture fixtures'
        run: |
          if [ -z "${APCTL_TESTDATA:-}" ]; then
            echo "::notice::APCTL_TESTDATA is not set: the capture-based golden tests return early and show as passed without checking anything"
          fi
      # The web UI is not needed: debug builds serve web/dist from disk if it exists.
      # informdump turns on serde_json's preserve_order; testing it on its own keeps the
      # other crates on the features the shipped binary is built with.
      - run: 'cargo test --workspace --exclude informdump --locked'
      - run: 'cargo test -p informdump --locked'
      - run: 'cargo clippy --workspace --all-targets --locked -- -D warnings'
      # informdump's MongoDB import is behind a feature; keep it compiling and linted.
      - run: 'cargo clippy -p informdump --features mongo --all-targets --locked -- -D warnings'

  web:
    runs-on: 'ubuntu-26.04'
    timeout-minutes: 10
    permissions:
      contents: 'read'
    defaults:
      run:
        working-directory: 'web'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      # npm's download cache, kept between runs (keyed by the lock file) and mounted into
      # the container, so npm ci does not fetch every package again.
      - uses: 'actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9' # v6.1.0
        with:
          path: '~/.npm'
          key: "npm-${{ hashFiles('web/package-lock.json') }}"
          restore-keys: 'npm-'
      # Same Node image as the Dockerfile's web stage; the runner's own Node may be older.
      # Lint (React hooks rules), then type-check and build.
      - run: |
          mkdir -p "$HOME/.npm"
          docker run --rm -v "$PWD:/web" -v "$HOME/.npm:/root/.npm" -w /web docker.io/library/node:24-slim sh -c "npm ci --no-fund --no-audit && npm run lint && npm run build"
