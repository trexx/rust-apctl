name: 'Test'

on:
  push:
    branches: [ 'master' ]
  pull_request:
  workflow_call:

# A newer push to a pull request cancels the run of the old one. Called from another
# workflow, github.workflow is the caller's, so the group is not the caller's own.
concurrency:
  group: 'test-${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: 'ubuntu-26.04'
    timeout-minutes: 30
    permissions:
      contents: 'read'
    steps:
      - uses: 'trexx/actions/.github/actions/checkout@shared-steps'
      - uses: 'trexx/actions/.github/actions/rust-toolchain@shared-steps'
        with:
          # The release of the Dockerfile's rust image: Renovate bumps both in one PR
          # (.github/renovate.json).
          toolchain: '1.99'
          components: 'clippy'
      - uses: 'trexx/actions/.github/actions/rust-cache@shared-steps'
      # The tests built on real captures need fixtures kept outside the repository
      # (APCTL_TESTDATA, docs/captures.md), which CI never has: they pass without
      # checking anything.
      - name: 'Capture fixtures'
        run: 'echo "::notice::the capture-based golden tests have no fixtures in CI (APCTL_TESTDATA): they return early and show as passed without checking anything"'
      # The web UI is not needed: debug builds serve web/dist from disk if it exists.
      # The checks are listed in scripts/check.sh, which the release gate runs too.
      - run: 'scripts/check.sh'

  web:
    runs-on: 'ubuntu-26.04'
    timeout-minutes: 10
    permissions:
      contents: 'read'
    steps:
      - uses: 'trexx/actions/.github/actions/checkout@shared-steps'
      # npm's download cache, kept between runs (keyed by the lock file) and mounted into
      # the container, so npm ci does not fetch every package again.
      - uses: 'trexx/actions/.github/actions/cache@shared-steps'
        with:
          path: '~/.npm'
          key: "npm-${{ hashFiles('web/package-lock.json') }}"
          restore-keys: 'npm-'
      # Lint (React hooks rules), type-check and build, in the Dockerfile's Node image (the
      # runner's own Node may be older). The release gate runs the same check.
      - run: 'scripts/check.sh --web'
