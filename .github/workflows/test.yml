name: 'Test'

on:
  push:
    branches: [ 'master' ]
  pull_request:
  workflow_call:

jobs:
  rust:
    runs-on: 'ubuntu-26.04'
    timeout-minutes: 30
    permissions:
      contents: 'read'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      - uses: 'dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f' # master
        with:
          toolchain: 'stable'
      - uses: 'Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6' # v2.9.2
      # The web UI is not needed: debug builds serve web/dist from disk if it exists.
      - run: 'cargo test --workspace --locked'

  web:
    runs-on: 'ubuntu-26.04'
    timeout-minutes: 10
    permissions:
      contents: 'read'
    defaults:
      run:
        working-directory: 'web'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      # Same Node image as the Dockerfile's web stage; the runner's own Node may be older.
      - run: 'docker run --rm -v "$PWD:/web" -w /web docker.io/library/node:24-slim sh -c "npm ci --no-fund --no-audit && npm run build"'
