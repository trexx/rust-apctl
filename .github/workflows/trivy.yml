name: 'Trivy'

# Scans the published image: the OS packages of the distroless base, and the crates
# apctl was built with (embedded by cargo auditable, see the Dockerfile).
on:
  schedule:
    - cron: '37 12 * * *'
  workflow_dispatch:

jobs:
  scan:
    uses: 'trexx/actions/.github/workflows/trivy.yml@9cbae3f30592d8d7f4ca8ed3714f64ef8dc06567' # main
    secrets: 'inherit'
    permissions:
      packages: 'read'
      contents: 'read'
      security-events: 'write'
      actions: 'read'
