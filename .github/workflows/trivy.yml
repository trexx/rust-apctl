name: 'Trivy'

# Scans the published images: the OS packages of the distroless base, and the crates
# apctl was built with (embedded by cargo auditable, see the Dockerfile); and the alpine
# packages of the capture sidecar, which parses untrusted traffic with raw-socket rights.
on:
  schedule:
    - cron: '37 12 * * *'
  workflow_dispatch:

jobs:
  scan:
    uses: 'trexx/actions/.github/workflows/trivy.yml@main'
    permissions:
      packages: 'read'
      contents: 'read'
      security-events: 'write'
      actions: 'read'

  # A finding here is fixed by the next release, which rebuilds the sidecar (build.yml).
  # Its own category, or its results would replace apctl's; no SBOM, which would replace
  # apctl's in the Dependency Graph.
  capture:
    uses: 'trexx/actions/.github/workflows/trivy.yml@main'
    permissions:
      packages: 'read'
      contents: 'read'
      security-events: 'write'
      actions: 'read'
    with:
      image: 'ghcr.io/${{ github.repository }}-capture:latest'
      category: 'trivy-capture'
      sbom: false
