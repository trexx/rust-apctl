name: 'Build'

# Push a version tag matching crates/controller/Cargo.toml (e.g. 0.15.1) to
# publish ghcr.io/trexx/rust-apctl:<version> and :latest.
on:
  push:
    tags: [ '[0-9]+.[0-9]+.[0-9]+' ]

jobs:
  version:
    runs-on: 'ubuntu-26.04'
    timeout-minutes: 5
    permissions:
      contents: 'read'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      - name: 'Tag matches the controller version'
        run: |
          CRATE="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/controller/Cargo.toml | head -n 1)"
          if [ "${CRATE}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match crates/controller/Cargo.toml (${CRATE})"
            exit 1
          fi

  test:
    uses: './.github/workflows/test.yml'
    permissions:
      contents: 'read'

  build:
    needs: [ 'version', 'test' ]
    uses: 'trexx/actions/.github/workflows/build.yml@9cbae3f30592d8d7f4ca8ed3714f64ef8dc06567' # main
    secrets: 'inherit'
    permissions:
      contents: read
      packages: write
