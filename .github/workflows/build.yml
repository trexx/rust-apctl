name: 'Build'

# Push a version tag matching crates/controller/Cargo.toml (e.g. 0.15.1) to
# publish ghcr.io/trexx/rust-apctl:<version> and :latest. This is the image's only
# publisher: scripts/release.sh builds and checks locally, and --pin pins the
# digest published here.
on:
  push:
    tags: [ '[0-9]+.[0-9]+.[0-9]+' ]

jobs:
  version:
    runs-on: 'ubuntu-26.04'
    timeout-minutes: 5
    permissions:
      contents: 'read'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      - name: 'Tag matches the controller version'
        run: |
          CRATE="$(scripts/version.sh)"
          if [ "${CRATE}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match crates/controller/Cargo.toml (${CRATE})"
            exit 1
          fi

  test:
    uses: './.github/workflows/test.yml'
    permissions:
      contents: 'read'

  build:
    needs: [ 'version', 'test' ]
    uses: 'trexx/actions/.github/workflows/build.yml@e9856c9003c97468cfa1cbc1a8130863b797d832' # main
    secrets: 'inherit'
    permissions:
      contents: read
      packages: write

  # The image CI published runs and reports the version, before release.sh --pin pins it.
  check:
    needs: [ 'build' ]
    runs-on: 'ubuntu-26.04'
    timeout-minutes: 10
    permissions:
      contents: 'read'
      packages: 'read'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      - run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          scripts/image-check.sh "ghcr.io/${{ github.repository_owner }}/rust-apctl:${GITHUB_REF_NAME}"
