name: 'Build'

# Push a version tag matching crates/controller/Cargo.toml (e.g. 0.15.1) to
# publish ghcr.io/trexx/rust-apctl:<version> and :latest, and the shadow-mode capture
# sidecar (the Dockerfile's `capture` stage) as ghcr.io/trexx/rust-apctl-capture with
# the same tags. This is the only publisher of both: scripts/release.sh builds and
# checks locally, and --pin pins the digest published here.
on:
  push:
    tags: [ '[0-9]+.[0-9]+.[0-9]+' ]

jobs:
  version:
    runs-on: 'ubuntu-26.04'
    timeout-minutes: 5
    permissions:
      contents: 'read'
    steps:
      - uses: 'trexx/actions/.github/actions/checkout@main'
      - name: 'Tag matches the controller version'
        run: |
          CRATE="$(scripts/version.sh)"
          if [ "${CRATE}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match crates/controller/Cargo.toml (${CRATE})"
            exit 1
          fi

  test:
    uses: './.github/workflows/test.yml'
    permissions:
      contents: 'read'

  build:
    needs: [ 'version', 'test' ]
    uses: 'trexx/actions/.github/workflows/build.yml@main'
    permissions:
      contents: read
      packages: write
    with:
      # The Image workflow's layer cache (image.yml), which a tag can read from main.
      # Read only: a tag's own cache could be read by that tag alone.
      cache_scope: 'apctl'
      cache_write: false

  # Rebuilt on every release, so the alpine and tcpdump fixes Renovate brings reach it.
  # No layer cache: image.yml builds the stage without caching it, and it is small.
  capture:
    needs: [ 'version', 'test' ]
    uses: 'trexx/actions/.github/workflows/build.yml@main'
    permissions:
      contents: read
      packages: write
    with:
      images: 'ghcr.io/${{ github.repository }}-capture'
      target: 'capture'
      # The package is not named after the repository, which pruning assumes.
      prune_images: false

  # The image CI published runs, reports the version and carries the manufacturer list
  # (scripts/image-check.sh), before release.sh --pin pins it.
  check:
    needs: [ 'build' ]
    runs-on: 'ubuntu-26.04'
    timeout-minutes: 10
    permissions:
      contents: 'read'
      packages: 'read'
    steps:
      - uses: 'trexx/actions/.github/actions/checkout@main'
      - uses: 'trexx/actions/.github/actions/docker-login@main'
        with:
          registry: 'ghcr.io'
          username: '${{ github.repository_owner }}'
          password: '${{ secrets.GITHUB_TOKEN }}'
      - run: 'scripts/image-check.sh "ghcr.io/${{ github.repository_owner }}/rust-apctl:${GITHUB_REF_NAME}"'
