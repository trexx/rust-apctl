name: 'Build'

# Push a version tag matching crates/controller/Cargo.toml (e.g. 0.15.1) to
# publish ghcr.io/trexx/rust-apctl:<version> and :latest. This is the image's only
# publisher: scripts/release.sh builds and checks locally, and --pin pins the
# digest published here.
on:
  push:
    tags: [ '[0-9]+.[0-9]+.[0-9]+' ]

jobs:
  version:
    runs-on: 'ubuntu-26.04'
    timeout-minutes: 5
    permissions:
      contents: 'read'
    steps:
      - uses: 'trexx/actions/.github/actions/checkout@main'
      - name: 'Tag matches the controller version'
        run: |
          CRATE="$(scripts/version.sh)"
          if [ "${CRATE}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match crates/controller/Cargo.toml (${CRATE})"
            exit 1
          fi

  test:
    uses: './.github/workflows/test.yml'
    permissions:
      contents: 'read'

  build:
    needs: [ 'version', 'test' ]
    uses: 'trexx/actions/.github/workflows/build.yml@main'
    permissions:
      contents: read
      packages: write
    with:
      # Every release stays published: the README tells people to pin a version, and the
      # shared pruning keeps only the newest two. The prune job below deletes untagged images.
      prune_images: false
      # The Image workflow's layer cache (image.yml), which a tag can read from main.
      cache_scope: 'apctl'

  # The image CI published runs, reports the version and carries the manufacturer list
  # (scripts/image-check.sh), before release.sh --pin pins it.
  check:
    needs: [ 'build' ]
    runs-on: 'ubuntu-26.04'
    timeout-minutes: 10
    permissions:
      contents: 'read'
      packages: 'read'
    steps:
      - uses: 'trexx/actions/.github/actions/checkout@main'
      - uses: 'trexx/actions/.github/actions/docker-login@main'
        with:
          registry: 'ghcr.io'
          username: '${{ github.repository_owner }}'
          password: '${{ secrets.GITHUB_TOKEN }}'
      - run: 'scripts/image-check.sh "ghcr.io/${{ github.repository_owner }}/rust-apctl:${GITHUB_REF_NAME}"'

  # Deletes only images no tag names (an earlier build of a rebuilt tag), with their
  # platform images and attestations. The patterns cover every tag this workflow makes,
  # but no digest: a pattern matching a digest would exclude it too ('*' keeps everything).
  prune:
    needs: [ 'build' ]
    runs-on: 'ubuntu-26.04'
    timeout-minutes: 10
    permissions:
      packages: 'write'
    steps:
      - uses: 'trexx/actions/.github/actions/prune-ghcr@main'
        with:
          exclude_tags: 'latest,*.*.*'
