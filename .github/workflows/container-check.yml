name: 'Container check'

# hadolint on every Dockerfile, and a build of the image(s) without pushing them.

on:
  pull_request:
  push:
    branches: [ 'main' ]

jobs:
  check:
    uses: 'trexx/actions/.github/workflows/container-check.yml@main'
    permissions:
      contents: 'read'
    with:
      # image.yml builds the image on pull requests, oui.yml the OUI list image.
      build_contexts: '[]'
