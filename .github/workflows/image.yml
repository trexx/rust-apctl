name: 'Image'

# Builds the runtime image without pushing it whenever what it is built from changes:
# Renovate automerges minor and digest bumps of the Dockerfile's images once the checks
# pass, and a bump that breaks the image (a new manufacturer list apctl cannot read, a glibc
# mismatch between the rust and distroless images) must fail here, not at the next release.
# The manifests too: the release profile and crate features are exercised only here.
on:
  push:
    branches: [ 'main' ]
    paths: [ 'Dockerfile', '.dockerignore', 'Cargo.toml', 'crates/*/Cargo.toml', 'Cargo.lock', 'web/package-lock.json', '.github/workflows/image.yml', 'scripts/image-check.sh', 'scripts/version.sh' ]
  pull_request:
    paths: [ 'Dockerfile', '.dockerignore', 'Cargo.toml', 'crates/*/Cargo.toml', 'Cargo.lock', 'web/package-lock.json', '.github/workflows/image.yml', 'scripts/image-check.sh', 'scripts/version.sh' ]

# A newer push to a pull request (Renovate rebasing it) cancels the build of the old one.
concurrency:
  group: 'image-${{ github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: 'ubuntu-26.04'
    timeout-minutes: 60
    permissions:
      contents: 'read'
    steps:
      - uses: 'trexx/actions/.github/actions/checkout@main'
      # The layers are cached between runs, in the scope the release build (build.yml)
      # shares: a bump of an image only the runtime stage uses (distroless, the
      # manufacturer list) or of one --target runtime never builds (the capture stage's
      # alpine) reuses the built controller. The Dockerfile's cache mounts are not part
      # of that cache: a stage that does run compiles from scratch.
      - uses: 'docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069' # v4.4.1
      - uses: 'docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc' # v7.4.0
        with:
          context: '.'
          target: 'runtime'
          tags: 'apctl:check'
          load: true
          provenance: false
          cache-from: 'type=gha,scope=apctl'
          cache-to: 'type=gha,scope=apctl,mode=max'
      - name: 'The image runs, reports the crate version and carries the manufacturer list'
        run: 'scripts/image-check.sh apctl:check'
