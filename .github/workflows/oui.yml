name: 'Manufacturer list'

# Publishes the IEEE manufacturer list (oui/Dockerfile) as
# ghcr.io/trexx/rust-apctl-oui:latest and :<date> once a month, and when its
# Dockerfile changes on main. The main Dockerfile pins :latest by digest: Renovate
# opens the digest bump, the Image workflow builds apctl with the new list, and the
# bump is automerged. Pull requests only build it.
on:
  schedule:
    - cron: '17 5 2 * *'
  workflow_dispatch:
  push:
    branches: [ 'main' ]
    paths: [ 'oui/**', '.github/workflows/oui.yml' ]
  pull_request:
    paths: [ 'oui/**', '.github/workflows/oui.yml' ]

jobs:
  build:
    uses: 'trexx/actions/.github/workflows/build.yml@main'
    permissions:
      contents: 'read'
      packages: 'write'
    with:
      context: '{{defaultContext}}:oui'
      images: 'ghcr.io/${{ github.repository }}-oui'
      tags: |
        type=raw,value=latest
        type=raw,value={{date 'YYYY-MM-DD'}}
      flavor: 'latest=false'
      push: ${{ github.event_name != 'pull_request' }}
      # The package is not named after the repository, which pruning assumes.
      prune_images: false
