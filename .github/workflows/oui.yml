name: 'Manufacturer list'

# Fetches the IEEE manufacturer list (oui/Dockerfile) once a month and publishes it as
# ghcr.io/trexx/rust-apctl-oui:latest and :<date>-<time> when it differs from the one
# published, so the same list never makes a new digest. The main Dockerfile pins :latest
# by digest: Renovate opens the digest bump, the Image workflow builds apctl with the new
# list, and the bump is automerged. A change of oui/Dockerfile is published by the next
# monthly run, or at once by running this workflow by hand on main; pull requests, and a
# manual run on any other branch, only fetch and compare.
on:
  schedule:
    - cron: '17 5 2 * *'
  workflow_dispatch:
  pull_request:
    paths: [ 'oui/**', '.github/workflows/oui.yml' ]

jobs:
  # A fresh download (no cache-from). Its layers go to a cache scope of this run only,
  # where the publish job finds them, so it publishes the very list compared here.
  fetch:
    runs-on: 'ubuntu-26.04'
    timeout-minutes: 15
    permissions:
      contents: 'read'
    outputs:
      changed: '${{ steps.compare.outputs.changed }}'
    steps:
      - uses: 'docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069' # v4.4.1
      - uses: 'docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc' # v7.4.0
        with:
          context: '{{defaultContext}}:oui'
          outputs: 'type=local,dest=${{ runner.temp }}/new'
          provenance: false
          cache-to: 'type=gha,scope=oui-${{ github.run_id }},mode=max'
      - id: 'compare'
        name: 'Compare with the published list'
        env:
          PUBLISHED: 'ghcr.io/${{ github.repository }}-oui:latest'
        # The published image's one file, exported as is. None (the first run, or the
        # registry not answering) counts as a change.
        run: |
          if echo "FROM ${PUBLISHED}" | docker buildx build --quiet --provenance=false --output "type=local,dest=${RUNNER_TEMP}/old" - \
            && cmp -s "${RUNNER_TEMP}/old/oui.csv" "${RUNNER_TEMP}/new/oui.csv"; then
            echo "::notice::The list is the one published as ${PUBLISHED}: nothing to publish"
            echo 'changed=false' >>"${GITHUB_OUTPUT}"
          else
            echo "::notice::$(wc -l <"${RUNNER_TEMP}/new/oui.csv") lines, not the list published as ${PUBLISHED}"
            echo 'changed=true' >>"${GITHUB_OUTPUT}"
          fi

  publish:
    needs: [ 'fetch' ]
    # Only the default branch publishes: a scheduled run is on it, a manual run must be.
    if: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && needs.fetch.outputs.changed == 'true' }}
    uses: 'trexx/actions/.github/workflows/build.yml@main'
    permissions:
      contents: 'read'
      packages: 'write'
    with:
      context: '{{defaultContext}}:oui'
      images: 'ghcr.io/${{ github.repository }}-oui'
      # The time too: a second list the same day gets a tag of its own, and every
      # published list keeps one.
      tags: |
        type=raw,value=latest
        type=raw,value={{date 'YYYY-MM-DD-HHmmss'}}
      flavor: 'latest=false'
      cache_scope: 'oui-${{ github.run_id }}'
      # The package is not named after the repository, which pruning assumes.
      prune_images: false
