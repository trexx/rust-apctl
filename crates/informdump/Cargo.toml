[package]
name = "informdump"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `informdump import` (reads a controller's MongoDB). Off by default: the 2.x
# driver, needed for the MongoDB 3.6 the official application bundles, pulls in
# an old TLS and DNS stack.
mongo = ["dep:mongodb", "dep:tokio", "dep:futures-util", "dep:apcfg"]

[dependencies]
anyhow.workspace = true
apcfg = { workspace = true, optional = true }
clap = { workspace = true, features = ["derive"] }
futures-util = { workspace = true, optional = true }
getrandom.workspace = true
hex.workspace = true
inform.workspace = true
mongodb = { workspace = true, optional = true }
regex.workspace = true
# Keys keep their order in everything informdump prints and writes (decoded
# payloads, --save, sanitised fixtures, demo-state), as when bson enabled it.
serde_json = { workspace = true, features = ["preserve_order"] }
tokio = { workspace = true, features = ["rt"], optional = true }
wire.workspace = true
