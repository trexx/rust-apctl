[package]
name = "informdump"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
etherparse = "0.21.0"
futures-util = "0.3.34"
hex = "0.4.3"
inform = { version = "0.1.0", path = "../inform" }
mongodb = "2.8"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt", "macros"] }
wire = { version = "0.1.0", path = "../wire" }
