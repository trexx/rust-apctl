[package]
name = "controller"
description = "Controller for Ubiquiti access points (working title apctl)"
version = "0.14.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
apcfg = { version = "0.1.0", path = "../apcfg" }
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive", "env"] }
flate2 = "1.1.10"
futures-util = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
inform = { version = "0.1.0", path = "../inform" }
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
russh = { version = "0.64", default-features = false, features = ["ring", "rsa"] }
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = "3.4.2"
wire = { version = "0.1.0", path = "../wire" }

[[bin]]
name = "apctl"
path = "src/main.rs"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
