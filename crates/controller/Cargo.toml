[package]
name = "controller"
description = "Controller for UniFi access points"
version = "0.15.1"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes-gcm.workspace = true
anyhow.workspace = true
apcfg.workspace = true
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22"
clap = { workspace = true, features = ["derive", "env"] }
flate2.workspace = true
futures-util.workspace = true
getrandom.workspace = true
hex.workspace = true
inform.workspace = true
regex.workspace = true
rusqlite = { version = "0.40.2", features = ["bundled"] }
russh = { version = "0.64", default-features = false, features = ["ring", "rsa"] }
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
sha-crypt = "0.6.0"
sha2 = "0.11.1"
tar = "0.4.46"
tokio = { workspace = true, features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower-http = { version = "0.6.11", features = ["compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = "3.4.2"
wire.workspace = true

[[bin]]
name = "apctl"
path = "src/main.rs"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
